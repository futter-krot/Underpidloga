 function renderQueensPuzzle(message='Расставь шесть знаков по правилам.'){document.querySelector('#queensModal')?.remove();const modal=document.createElement('div');modal.id='queensModal';modal.className='queens-modal';modal.innerHTML=`<section class="queens-instructions"><span class="queens-kicker">ЗАМОК СУНДУКА · МЕХАНИЗМ РАЗБЛОКИРОВКИ</span><h2>Шифр из шести знаков</h2><p>Поставь по одному знаку в каждую строку. Поле состоит из шести строк и шести столбцов.</p><ol><li>В каждом столбце должен быть ровно один знак.</li><li>В каждой цветной области должен быть ровно один знак.</li><li>Знаки не должны соприкасаться, даже по диагонали.</li></ol><p>Нажми на клетку, чтобы поставить знак. Повторный щелчок снимет его.</p><p id="queensStatus" class="queens-status">${escapeHtml(message)}</p><div class="queens-actions"><button id="queensCheck" class="primary">ПРОВЕРИТЬ ШИФР</button><button id="queensReset">СБРОСИТЬ</button><button id="queensClose">ЗАКРЫТЬ</button></div><span class="queens-note">В каждой строке может находиться только один знак. Цветные области обведены границами.</span></section><div class="queens-board-wrap"><div class="queens-board" role="grid" aria-label="Поле загадки ключевых знаков">${Array.from({length:6},(_,r)=>Array.from({length:6},(_,c)=>{const region=queenRegion(r,c),picked=S.queensMarks[r]===c;const same=(rr,cc)=>rr>=0&&rr<6&&cc>=0&&cc<6&&queenRegion(rr,cc)===region;return `<button class="queens-cell" role="gridcell" aria-label="Строка ${r+1}, столбец ${c+1}, область ${region+1}${picked?', знак установлен':''}" data-row="${r}" data-col="${c}" style="background:${queenColors[region]};border-top:${r===0||!same(r-1,c)?'2px solid #e4d0a0aa':'1px solid #10120f44'};border-bottom:${r===5||!same(r+1,c)?'2px solid #e4d0a0aa':'1px solid #10120f44'};border-left:${c===0||!same(r,c-1)?'2px solid #e4d0a0aa':'1px solid #10120f44'};border-right:${c===5||!same(r,c+1)?'2px solid #e4d0a0aa':'1px solid #10120f44'}">${picked?'<span class="queens-dot"></span>':''}</bu     function renderAct3KeyFailure(){document.querySelector('.act3-terminal-modal')?.remove();const screen=document.createElement('div');screen.className='surrender-video-screen';const video=document.createElement('video');video.preload='auto';video.playsInline=true;video.src=asset(media.surrender);video.setAttribute('aria-label','Катсцена поражения в загадке ключа');let ended=false;const finish=()=>{if(ended)return;ended=true;screen.remove();showAct3KeyFailurePrompt()};video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});screen.append(video);document.body.append(screen);video.play().catch(()=>{video.controls=true})}
    function showAct3KeyFailurePrompt(){const modal=document.createElement('div');modal.className='act3-terminal-modal';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.setAttribute('aria-label','Повтор загадки ключа');modal.innerHTML='<section class="act3-terminal-card"><p class="act3-terminal-kicker">СИСТЕМА ДОСТУПА · ЛИФТ</p><h2>ПОПЫТКА ПРОВАЛЕНА</h2><p class="act3-terminal-status">Все шесть ошибок исчерпаны. Терминал ждёт новой попытки.</p><div class="act3-terminal-actions"><button type="button" data-retry>ПОВТОРИТЬ ЭТАП</button></div></section>';$('#viewport').append(modal);modal.querySelector('[data-retry]').onclick=()=>{if(S.act3KeyStage===1)S.act3KeyPicked=[];else S.act3KeyDraft=['','',''];S.act3KeyErrors=0;renderAct3KeyTerminal('Терминал перезапущен. Попробуйте ещё раз.')}}
    function openAct3KeyTerminal(){if(S.act3KeySolved){showAct3Up6();return}renderAct3KeyTerminal()}
    function kpStartLightning(){const flash=document.createElement('div');flash.className='kp-lightning-flash';flash.setAttribute('aria-hidden','true');$('#viewport').append(flash);setTimeout(()=>flash.remove(),1200)}
    function pauseKpMirrorFaultTimer(){if(!S.kpMirrorFaultTimer)return;S.kpMirrorFaultRemaining=Math.max(0,S.kpMirrorFaultDeadline-performance.now());clearTimeout(S.kpMirrorFaultTimer);S.kpMirrorFaultTimer=null;S.kpMirrorFaultDeadline=0}
    function scheduleKpMirrorFault(delay){if(!S.kpStationReady||!S.kpCataclysmStarted||S.kpEndSequence||!kpAllMirrorsAligned())return;clearTimeout(S.kpMirrorFaultTimer);const wait=Number.isFinite(delay)?Math.max(0,delay):20000+Math.random()*60000;S.kpMirrorFaultRemaining=wait;S.kpMirrorFaultDeadline=performance.now()+wait;S.kpMirrorFaultTimer=setTimeout(()=>{S.kpMirrorFaultTimer=null;S.kpMirrorFaultDeadline=0;S.kpMirrorFaultRemaining=null;if(!S.kpStationReady||S.kpEndSequence||!kpAllMirrorsAligned())return;const index=Math.floor(Math.random()*3);S.kpMirrorsAligned[index]=false;refreshKpMirrorScreen(index);hotelToast(`${kpMirrorConfig[index].label}: зеркало вышло из строя. Настройте его заново.`,5000)},wait)}
    function refreshKpMirrorScreen(index){if(index===0&&S.screen==='kp5'){updateKpMirrorHotspot(0);return}if(index===1){if(S.screen==='kp5')showKp5();else if(S.screen==='kp6')showKp6();return}if(index===2){if(S.screen==='kp5')showKp5();else if(S.screen==='kp6')showKp6();else if(S.screen==='kp9')showKp9()}}
    function breakKpMirrorAfterShot(){const index=Math.floor(Math.random()*3);S.kpMirrorsAligned[index]=false;refreshKpMirrorScreen(index);return index}
    function fireKpLaser(){if(S.kpShotBusy||S.kpEndSequence)return;if(!S.kpStationReady){hotelToast('Сначала запустите электростанцию.');return}if(!kpAllMirrorsAligned()){hotelToast('Одно из зеркал вышло из строя. Настройте его перед выстрелом.');return}pauseKpMirrorFaultTimer();const successful=S.kpEyeActive;S.kpShotBusy=true;showKpScene('kp-capella1-shot',media.kpCapellaShot,'Капелла · выстрел',null,null);const silkVoice=successful?new Promise(resolve=>setTimeout(()=>{if(!S.kpShotBusy||S.kpEndSequence){resolve();return}resolve(playKpClip(media.kpSilkHit,.66,90000))},1500)):Promise.resolve();kpStartLightning();playKpClip(media.kpLaser,.72,45000).then(async()=>{if(!S.kpShotBusy||S.kpEndSequence)return;if(successful){S.kpSuccessShots++;kpStartLightning();shakeKpScene();dropKpDust();await Promise.all([silkVoice,playKpClip(media.kpEarthIndoor,.56,60000)])}if(!S.kpShotBusy||S.kpEndSequence)return;const broken=breakKpMirrorAfterShot();if(successful&&S.kpSuccessShots>=3){S.kpShotBusy=false;showKpVictory();return}S.kpShotBusy=false;showKpCapella1();hotelToast(successful?`Успешное попадание ${S.kpSuccessShots} / 3. ${kpMirrorConfig[broken].label} повреждено.`:`Глаз не был виден. Выстрел не засчитан; ${kpMirrorConfig[broken].label} повреждено.`,5000)})}
    function fireKpLaserFromButton(){fireKpLaser()}
    function kpMirrorHotspotLabel(index){return S.kpMirrorsAligned[index]?`Настроить зеркало ${['I','II','III'][index]}`:`Починить зеркало ${['I','II','III'][index]}`}
    function updateKpMirrorHotspot(index){const target=spots.querySelector('.hotspot');if(!target)return;const label=kpMirrorHotspotLabel(index);target.title=label;target.setAttribute('aria-label',label)}
    function showKp5(){const hasBeam=S.kpStationStarted&&S.kpMirrorsAligned[1]&&S.kpMirrorsAligned[2],file=hasBeam?media.kp5Aligned:media.kp5;showKpScene('kp5',file,'Левая улица',showKp3,showKp6);if(hasBeam)hotspot(86,3,14,35,kpMirrorHotspotLabel(0),()=>openKpMirrorTerminal(0));else hotspot(68,3,18,28,kpMirrorHotspotLabel(0),()=>openKpMirrorTerminal(0))}
    function showKp6(){const hasBeam=S.kpStationStarted&&S.kpMirrorsAligned[2],file=hasBeam?media.kp6Aligned:media.kp6;showKpScene('kp6',file,'Переулок',showKp5,showKp9);hotspot(19,2,29,44,kpMirrorHotspotLabel(1),()=>openKpMirrorTerminal(1))}
    function showKp9(){const file=S.kpStationStarted?media.kp9Aligned:media.kp9;showKpScene('kp9',file,'Старый комплекс',showKp6,showKp7);hotspot(56,8,22,39,kpMirrorHotspotLabel(2),()=>openKpMirrorTerminal(2))}
    function showKp7(){if(S.hotelInventory.includes('kpMemo')){showKpScene('kp7',S.kpStationReady?media.kp8Ready:media.kp7,'Машинный зал',showKp9,null);if(!S.kpStationStarted)hotspot(28,26,44,51,'Включить электростанцию',kpPowerConfirm);else if(S.kpStationReady)hotspot(28,26,44,51,'Осмотреть лазерную установку',showKpPowerReady);return}showKpScene('kp7.1',media.kp7Note,'Машинный зал',showKp9,null);hotspot(65,80,11,12,'Подобрать маленький журнальчик с запиской',()=>{addHotelItem('kpMemo');hotelToast('Записка добавлена в инвентарь.');showKp7()})}
    function showKratopolisPanorama(){stopSound(S.kpPitAmbient);S.kpPitAmbient=null;setImage('kp1',media.kp1,'');$('#chapter').textContent='Акт I';arrows.innerHTML='';spots.innerHTML='';stopSound(S.kpOpening);const openingMusic=startKpOpeningAudio();playKpReveal(()=>fadeOpeningMusicWithFinalZoom(openingMusic)).then(()=>{if(S.kpOpening===openingMusic)S.kpOpening=null;scene.style.backgroundImage='none';scene.style.backgroundColor='#000';scene.style.animation='none';showActTwoCard(()=>{stopSound(S.kpAmbient);S.kpAmbient=sound(media.nomaiAmb,true,.24);showKp3()})})}
  function openSurrenderConfirmation(){if(document.querySelector('.surrender-confirm,.surrender-video-screen,.surrender-ending'))return;const modal=document.createElement('div');modal.className='surrender-confirm';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.innerHTML='<div class="surrender-card"><h2>Вы уверены, что хотите сдаться?</h2><div class="surrender-actions"><button type="button" data-cancel>Остаться</button><button type="button" class="confirm" data-confirm>Сдаться</button></div></div>';document.body.append(modal);modal.querySelector('[data-cancel]').onclick=()=>modal.remove();modal.querySelector('[data-confirm]').onclick=()=>{modal.remove();playSurrenderEnding()};modal.querySelector('[data-cancel]').focus()}
    function playSurrenderEnding(){clearTimeout(S.openingTimer);stopSound(S.kpOpening);S.kpOpening=null;stopSound(S.kpPitAmbient);S.kpPitAmbient=null;stopSound(S.kpAmbient);S.kpAmbient=null;S.activeTyping?.cancel();document.querySelector('.dialogue')?.remove();stopSound(S.openingSound);S.openingSound=null;stopSound(S.moleSound);S.moleSound=null;stopCaveAmbient();stopDrips();stopHotelAudio();dialogueVideo.pause();dialogueVideo.onended=null;dialogueVideo.onerror=null;dialogueVideo.onclick=null;dialogueVideo.removeAttribute('src');dialogueVideo.load();dialogueVideo.style.display='none';const screen=document.createElement('div');screen.className='surrender-video-screen';const video=document.createElement('video');video.preload='auto';video.playsInline=true;video.src=asset(media.surrender);video.setAttribute('aria-label','Финальная видеозаставка');let ended=false;const finish=()=>{if(ended)return;ended=true;screen.remove();const ending=document.createElement('div');ending.className='surrender-ending';ending.innerHTML='<h1>Конец игры</h1><p>вы совершили суицид</p>';document.body.append(ending)};video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});screen.append(video);document.body.append(screen);video.play().catch(()=>{video.controls=true})}
  $('#surrenderButton').onclick=openSurrenderConfirmation;
  $('#viewport').addEventListener('pointerdown',()=>{if(S.hotelStarted)ensureHotelAmbience()},{passive:true});
  function showUpper(){setImage('upper',media.upper,'Выход лифта');}
 // Start in the quiet black opening unless a direct test start was requested in the URL.
 const quickStart=new URLSearchParams(window.location.search).get('start');
   if(['hall','corridor','up7','hotel'].includes(quickStart)){$('#intro-black').style.display='none';enterHotelHall()}
  else if(quickStart==='mirror-choice'||quickStart==='mirror'){$('#intro-black').style.display='none';showAct3Up8()}
  else if(quickStart==='up8'){$('#intro-black').style.display='none';showUp8()}
  else if(quickStart==='kp7-ready'){$('#intro-black').style.display='none';$('#surrenderButton').hidden=false;S.kpMirrorsAligned=[true,true,true];S.kpStationStarted=false;S.kpStationReady=false;addHotelItem('kpMemo');showKp7();S.kpAmbient=sound(media.nomaiAmb,true,.24);document.addEventListener('pointerdown',()=>{if(S.kpAmbient?.paused)S.kpAmbient.play().catch(()=>{})},{once:true})}
   else if(quickStart==='act3'){$('#intro-black').style.display='none';$('#surrenderButton').hidden=false;showKpVictory()}
   else if(quickStart==='act3-after-hanoi'){$('#intro-black').style.display='none';$('#surrenderButton').hidden=false;S.act3HanoiSolved=true;showAct3Up4()}
  else if(quickStart==='act2'||quickStart==='kp3'){$('#intro-black').style.display='none';$('#surrenderButton').hidden=false;showKp3();S.kpAmbient=sound(media.nomaiAmb,true,.24);document.addEventListener('pointerdown',()=>{if(S.kpAmbient?.paused)S.kpAmbient.play().catch(()=>{})},{once:true})}
  else{setScreen('intro',null,'');$('#intro-black').style.display='flex';$('#viewport').addEventListener('click',()=>{if(!S.introStarted)startIntro()},{once:true})}
})();
