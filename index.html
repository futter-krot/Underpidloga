  function openHotelRoom(){stopHallHum();ensureHotelAmbience();S.hotelSide=0;renderHotelWall();if(!S.hotelRoomVisited){S.hotelRoomVisited=true;say([['???','Добро пожаловать в отель Крат!'],['Крат','Откуда вы все говорите?'],['???','К несчастью я не смогу лично принять вас, также, к сожалению, мы не можем принять новых постояльцев ввиду нехватки номеров.'],['???','Впрочем есть выход из данного положения, но я такая голодная.']])}}
  function changeHotelSide(delta){S.hotelSide=(S.hotelSide+delta+4)%4;renderHotelWall()}
  function renderHotelWall(){const side=S.hotelSide;let file=media.cabinet[side],name=`Отель Крат · стена ${side+1}`;if(side===0&&S.treeGrown)file=S.seed2Planted?media.cabinetRose:media.cabinetTree;if(side===3&&S.portraitRevealed)file=media.cabinetPoster;setImage('hotel-room',file,name);arrows.innerHTML='';spots.innerHTML='';arrow('left','Предыдущая стена',()=>changeHotelSide(-1));arrow('right','Следующая стена',()=>changeHotelSide(1));
   if(side===0){if(S.treeGrown)hotspot(76,43,23,54,'Осмотреть красное дерево',collectHotelFruit);else hotspot(85,58,13,30,'Цветочный горшок',plantHotelSeed);hotspot(20,8,18,26,'Солнце на двери — ввести 1',()=>pressHotelDoor(1));hotspot(61,8,18,26,'Луна на двери — ввести 0',()=>pressHotelDoor(0));hotspot(37,26,26,42,'Дверь',()=>{if(!S.leverPulled||S.puzzlesSolved<4)hotelToast('Замок пока не реагирует.');else hotelToast(`Код введён: ${S.doorInput.length}/8`)})}
   if(side===1){hotspot(57,16,28,75,'Экран торгового автомата',openVending);hotspot(22,31,15,25,'Рычаг n → n + 1',pullHotelLever)}
   if(side===2){if(!S.pizzaTaken)hotspot(78,69,16,30,'Мусорное ведро',takePizza);hotspot(25,62,50,35,'Стойка регистрации',useAtReception)}
   if(side===3&&S.posterCollected&&!S.portraitRevealed)hotspot(43,20,15,34,'Повесить постер на средний портрет',hangPoster);
   if(side===0&&S.leverPulled){const code=document.createElement('div');code.className='hotel-door-code';code.innerHTML=`КОД · <span class="hotel-door-count">${S.doorInput.length}/8</span><b>${S.doorInput.map(v=>v?'☼':'●').join(' ')||'· · · · · · · ·'}</b>`;$('#viewport').append(code)}
  }
  function takePizza(){if(S.pizzaTaken)return;S.pizzaTaken=true;addHotelItem('pizza');hotelToast('В ведре нашёлся холодный кусок пиццы.')}
  function useAtReception(){if(S.hotelSelected==='pizza'&&S.hotelInventory.includes('pizza')&&!S.pizzaGiven){S.pizzaGiven=true;removeHotelItem('pizza');say([['???','Ням ням. Теперь ты, Крат.']],()=>playHotelVideo(()=>say([['???','Полагаю это решит твою проблему.']],()=>{addHotelItem('coin');hotelToast('Получена монета. Автомат находится на стене 2.')})));return}
   if(S.hotelSelected==='egg'&&S.hotelInventory.includes('egg')&&!S.eggGiven){S.eggGiven=true;removeHotelItem('egg');say([['???','Да, неплохо. Держи.']],()=>{S.posterCollected=true;addHotelItem('poster');hotelToast('Получен постер с подсказкой.')});return}
   if(S.hotelSelected==='rose'&&S.hotelInventory.includes('rose')&&!S.roseGiven){S.roseGiven=true;removeHotelItem('rose');S.nameAsked=true;say([['???','Назови моё имя']],openHotelNameInput);return}
   if(!S.pizzaTaken)hotelToast('На стойке тихо. Ведро стоит справа.');else if(S.hotelSelected==='pizza')hotelToast('Кусок пиццы исчезает за стойкой.');else if(S.hotelSelected==='egg'&&!S.eggGiven)hotelToast('Кажется, хозяйка снова проголодалась.');else if(S.hotelSelected==='rose'&&!S.roseGiven)hotelToast('За стойкой ждут ответа.');else hotelToast('Колокольчик молчит. Нужный предмет пока не выбран.')}
  function playHotelVideo(onDone){const video=dialogueVideo;video.pause();video.src=asset(media.pizzaVideo);video.style.display='block';video.currentTime=0;let complete=false;const finish=()=>{if(complete)return;complete=true;video.pause();video.style.display='none';video.removeAttribute('src');video.onended=null;video.onerror=null;video.onclick=null;onDone?.()};video.onended=finish;video.onerror=finish;video.onclick=()=>video.play().catch(finish);video.play().catch(()=>hotelToast('Нажми на видео, чтобы начать воспроизведение.',4000));}
  function plantHotelSeed(){if(S.hotelSelected==='seed1'&&S.hotelInventory.includes('seed1')&&!S.seed1Planted){removeHotelItem('seed1');S.seed1Planted=true;S.treeGrown=true;renderHotelWall();hotelToast('Семечко посажено. Из земли поднимается красное дерево.');return}if(S.hotelSelected==='seed2'&&S.hotelInventory.includes('seed2')&&!S.seed2Planted){removeHotelItem('seed2');S.seed2Planted=true;S.treeGrown=true;renderHotelWall();hotelToast('Вторая ветка тянется к свету.');return}if(S.treeGrown)collectHotelFruit();else hotelToast('Пустой горшок ждёт семечко.')}
  function collectHotelFruit(){if(!S.treeGrown)return;S.treeGrown=false;renderHotelWall();if(S.seed2Planted&&!S.roseCollected){S.roseCollected=true;addHotelItem('rose');hotelToast('На ветке распустилась роза.')}else if(S.seed1Planted&&!S.eggCollected){S.eggCollected=true;addHotelItem('egg');say([['???','Я снова проголодалась, покормишь меня?']])}else hotelToast('На дереве больше ничего нет.')}
  function hangPoster(){if(!S.posterCollected||S.portraitRevealed)return;S.posterCollected=false;removeHotelItem('poster');S.portraitRevealed=true;renderHotelWall();hotelToast('На пустом портрете появилась подсказка «33».')}
  function openHotelNameInput(){document.querySelector('.hotel-name-modal')?.remove();const modal=document.createElement('div');modal.className='hotel-name-modal';modal.innerHTML='<div class="hotel-name-card"><h2>ИМЯ ХОЗЯЙКИ</h2><p>Введи имя, которое она просит назвать.</p><input id="hotelNameInput" autocomplete="off" aria-label="Имя хозяйки"><button id="hotelNameSubmit">ОТВЕТИТЬ</button></div>';$('#viewport').append(modal);const input=modal.querySelector('input');const submit=()=>{const value=input.value.trim().toLocaleLowerCase('ru-RU').replaceAll('ё','е');if(value==='двойню'){modal.remove();say([['Двойню','Да. всё так. Ну и глупое же имя ты мне выбрал.'],['Двойню','До новых встреч, папа.'],['Крат','Стой!']],()=>hotelBlackoutAfterDaughter())}else{hotelToast('Это не то имя.');input.focus()}};modal.querySelector('#hotelNameSubmit').onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});input.focus()}
  async function hotelBlackoutAfterDaughter(){arrows.style.visibility='hidden';spots.style.visibility='hidden';await fadeBlack(700);await new Promise(resolve=>playAndWait(media.soda,resolve,5000,.65));await unfade();arrows.style.visibility='';spots.style.visibility='';say([['Крат','Неужели моей дочери на меня начхать?']],()=>{S.lossNote=true;addHotelItem('lossNote');hotelToast('В инвентаре появилась записка.')})}
   function openHotelNote(kind){if(kind==='loss'&&!S.lossNote)return;if(kind==='rules'&&!S.rulesNote)return;if(kind==='loss')S.lossClueSeen=true;else S.rulesSeen=true;sound(media.paper,false,.65);document.querySelector('.hotel-paper-modal')?.remove();const modal=document.createElement('div');modal.className='hotel-paper-modal';const body=kind==='loss'?`<div class="hotel-paper"><button class="hotel-paper-close" aria-label="Закрыть">×</button><img src="${asset(media.loss)}" alt="Записка с рисунком для загадки"></div>`:`<div class="hotel-paper"><button class="hotel-paper-close" aria-label="Закрыть">×</button><h3>ПРАВИЛА · СОЛНЦА И ЛУНЫ</h3><ol><li>В каждой строке и каждом столбце поровну солнц и лун: по четыре.</li><li>Нельзя ставить больше двух одинаковых символов подряд по горизонтали или вертикали.</li><li>Нажимай на клетку, чтобы менять луну на солнце и обратно.</li></ol></div>`;modal.innerHTML=body;$('#viewport').append(modal);modal.querySelector('.hotel-paper-close').onclick=()=>modal.remove()}
  const hotelGuestRows=['10110010','01101001','11000110','00011011','10001101','01110010','00101101','11001010'];
  const hotelGuestCode=hotelGuestRows.map((row,index)=>row[index]==='1'?'0':'1').join('');
  const hotelTangoGivens=[[0,6,1],[1,1,0],[1,2,0],[1,5,0],[1,6,1],[2,0,1],[3,2,0],[3,5,0],[3,6,0],[4,2,1],[4,4,1],[5,1,1],[6,1,0],[6,3,0],[6,7,1],[7,0,1],[7,5,0]];
   function hotelTarget(index){const grid=Array.from({length:8},()=>Array(8).fill(0));if(index===0){for(let c=0;c<8;c++)for(let r=0;r<8;r++)grid[r][c]=c%2?1:0}
    if(index===1){for(const r of [0,3,7])grid[r].fill(1);for(let r=0;r<8;r++)if(r!==1&&r!==2){grid[r][3]=1;grid[r][7]=1}[[1,2],[2,1],[1,6],[2,5]].forEach(([r,c])=>grid[r][c]=1)}
   if(index===2){['10100011','10100010','10100010','00000000','00000000','01000011','01000011','01000011'].forEach((row,r)=>[...row].forEach((value,c)=>grid[r][c]=Number(value)))}
   if(index===3){hotelTangoGivens.forEach(([r,c,v])=>grid[r][c]=v)}return grid}
  function createHotelDraft(index){if(index===2){const grid=Array.from({length:8},()=>Array(8).fill(1));for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(r===3||r===4||c===3||c===4)grid[r][c]=0;return grid}if(index===3){const grid=Array.from({length:8},()=>Array(8).fill(null));hotelTangoGivens.forEach(([r,c,v])=>grid[r][c]=v);return grid}return Array.from({length:8},()=>Array(8).fill(0))}
   function openVending(){if(S.leverPulled){renderCantorTerminal();return}if(!S.coinInserted){if(S.hotelSelected!=='coin'||!S.hotelInventory.includes('coin'))return;removeHotelItem('coin');S.coinInserted=true;S.hotelSelected=null;sound(media.coinInsert,false,.65)}const index=S.puzzlesSolved;if(index>=4)return;const allowed=index===0||index===1&&S.portraitRevealed||index===2&&S.lossClueSeen||index===3&&S.rulesSeen;if(!allowed)return;if(!S.puzzleDrafts[index])S.puzzleDrafts[index]=createHotelDraft(index);renderHotelPuzzle(index)}
   function renderHotelPuzzle(index){document.querySelector('.hotel-puzzle')?.remove();const draft=S.puzzleDrafts[index]||createHotelDraft(index);S.puzzleDrafts[index]=draft;const modal=document.createElement('div');modal.className='hotel-puzzle';modal.innerHTML=`<button class="hotel-close" id="hotelPuzzleClose" aria-label="Закрыть">×</button><h2>СХЕМА ${index+1}</h2><div class="hotel-board-wrap"><div class="hotel-board" role="grid" aria-label="Поле загадки 8 на 8">${Array.from({length:8},(_,r)=>Array.from({length:8},(_,c)=>{const locked=index===2&&(r===3||r===4||c===3||c===4),given=index===3&&hotelTangoGivens.some(([rr,cc])=>rr===r&&cc===c);const val=draft[r][c];return `<button class="hotel-cell ${locked?'locked':''} ${given?'given':''}" data-r="${r}" data-c="${c}" aria-label="Строка ${r+1}, столбец ${c+1}, ${val===null?'не заполнено':val?'солнце':'луна'}${locked?', закрытая клетка':''}" ${locked||given?'disabled':''}>${val===null?'':`<span class="hotel-symbol ${val?'sun':'moon'}"></span>`}</button>`}).join('')).join('')}</div></div><div class="hotel-actions"><button class="primary" id="hotelPuzzleCheck">ПРОВЕРИТЬ</button><button id="hotelPuzzleReset">СБРОСИТЬ</button></div>`;$('#viewport').append(modal);modal.querySelectorAll('.hotel-cell:not(:disabled)').forEach(cell=>cell.onclick=()=>{const r=+cell.dataset.r,c=+cell.dataset.c;if(index===3)draft[r][c]=draft[r][c]===null?1:draft[r][c]===1?0:null;else draft[r][c]=1-draft[r][c];cell.innerHTML=draft[r][c]===null?'':`<span class="hotel-symbol ${draft[r][c]?'sun':'moon'}"></span>`;cell.setAttribute('aria-label',`Строка ${r+1}, столбец ${c+1}, ${draft[r][c]===null?'не заполнено':draft[r][c]?'солнце':'луна'}`)});modal.querySelector('#hotelPuzzleClose').onclick=()=>modal.remove();modal.querySelector('#hotelPuzzleCheck').onclick=()=>checkHotelPuzzle(index);modal.querySelector('#hotelPuzzleReset').onclick=()=>{S.puzzleDrafts[index]=createHotelDraft(index);renderHotelPuzzle(index)}}
  function checkTango(grid){if(grid.some(row=>row.some(value=>value===null)))return 'Заполни все открытые клетки.';for(let r=0;r<8;r++){if(grid[r].filter(v=>v===1).length!==4)return `В строке ${r+1} должно быть ровно четыре солнца.`;for(let c=0;c<6;c++)if(grid[r][c]===grid[r][c+1]&&grid[r][c]===grid[r][c+2])return `В строке ${r+1} нашлось больше двух одинаковых символов подряд.`}for(let c=0;c<8;c++){let suns=0;for(let r=0;r<8;r++){suns+=grid[r][c]===1?1:0;if(r<6&&grid[r][c]===grid[r+1][c]&&grid[r][c]===grid[r+2][c])return `В столбце ${c+1} нашлось больше двух одинаковых символов подряд.`}if(suns!==4)return `В столбце ${c+1} должно быть ровно четыре солнца.`}return ''}
   function checkHotelPuzzle(index){const grid=S.puzzleDrafts[index],target=hotelTarget(index);let valid;if(index<3)valid=grid.every((row,r)=>row.every((value,c)=>value===target[r][c]));else valid=!checkTango(grid);if(!valid){const board=document.querySelector('.hotel-board');board?.classList.remove('wrong');if(board){void board.offsetWidth;board.classList.add('wrong')}return}
    document.querySelector('.hotel-puzzle')?.remove();S.puzzlesSolved++;if(index===0){sound(media.vendingReceive,false,.62);addHotelItem('seed1')}else if(index===1){sound(media.vendingReceive,false,.62);addHotelItem('seed2')}else if(index===2){sound(media.vendingReceive,false,.62);S.rulesNote=true;addHotelItem('rulesNote')}}
   function renderCantorTerminal(){document.querySelector('.hotel-puzzle')?.remove();const modal=document.createElement('div');modal.className='hotel-puzzle hotel-cantor-terminal';modal.innerHTML=`<button class="hotel-close" id="hotelPuzzleClose" aria-label="Закрыть">×</button><div class="hotel-board-wrap"><div class="hotel-cantor-grid">${hotelGuestRows.map((row,r)=>`<span class="hotel-guest-number">${r+1}</span>${row.split('').map((v,c)=>`<span class="hotel-cantor-cell" aria-label="Постоялец ${r+1}, символ ${c+1}"><span class="hotel-symbol ${v==='1'?'sun':'moon'}"></span></span>`).join('')}<span class="hotel-cantor-right-tail" aria-label="Дальше ряд продолжается">⋯</span>`).join('')}<span class="hotel-guest-number">∞</span>${Array.from({length:8},()=>'<span class="hotel-cantor-tail">⋮</span>').join('')}<span class="hotel-cantor-right-tail" aria-label="Продолжение таблицы">⋯</span></div></div><p class="hotel-cantor-caption">Пройди туда, где прежде никто не был</p>`;$('#viewport').append(modal);modal.querySelector('#hotelPuzzleClose').onclick=()=>modal.remove()}
   function pullHotelLever(){if(S.leverPulled||S.puzzlesSolved<4)return;S.leverPulled=true;const anim=document.createElement('div');anim.className='hotel-lever-animation';$('#viewport').append(anim);sound(media.elevatorArrive,false,.65);sound(media.gear,false,.62);setTimeout(()=>anim.remove(),900)}
   function pressHotelDoor(bit){if(!S.leverPulled||S.puzzlesSolved<4)return;if(S.doorInput.length>=8)return;const soundFile=media.minecraft[Math.floor(Math.random()*media.minecraft.length)];sound(soundFile,false,.55);S.doorInput.push(bit);const display=document.querySelector('.hotel-door-code b'),count=document.querySelector('.hotel-door-count');if(display)display.textContent=S.doorInput.map(v=>v?'☼':'●').join(' ');if(count)count.textContent=`${S.doorInput.length}/8`;if(S.doorInput.length===8){if(S.doorInput.join('')===hotelGuestCode){setTimeout(finishHotelExit,380)}else{S.doorInput=[];setTimeout(()=>{if(S.screen==='hotel-room'&&S.hotelSide===0&&S.doorInput.length===0){const code=document.querySelector('.hotel-door-code b'),counter=document.querySelector('.hotel-door-count');if(code)code.textContent='· · · · · · · ·';if(counter)counter.textContent='0/8'}},500)}}}
  async function finishHotelExit(){if(S.hotelEnded)return;S.hotelEnded=true;arrows.innerHTML='';spots.innerHTML='';document.querySelector('.hotel-door-code')?.remove();await rideFade(true);await new Promise(resolve=>playAndWait(media.portal,resolve,6000,.75));stopHotelAudio();const ending=document.createElement('div');ending.className='hotel-end';ending.innerHTML='<div><h2>ВЫХОД</h2><p>КОРИДОР ОСТАЛСЯ ПОЗАДИ</p></div>';$('#viewport').append(ending);}
  function openSurrenderConfirmation(){if(document.querySelector('.surrender-confirm,.surrender-video-screen,.surrender-ending'))return;const modal=document.createElement('div');modal.className='surrender-confirm';modal.setAttribute('role','dialog');modal.setAttribute('aria-modal','true');modal.innerHTML='<div class="surrender-card"><h2>Вы уверены, что хотите сдаться?</h2><div class="surrender-actions"><button type="button" data-cancel>Остаться</button><button type="button" class="confirm" data-confirm>Сдаться</button></div></div>';document.body.append(modal);modal.querySelector('[data-cancel]').onclick=()=>modal.remove();modal.querySelector('[data-confirm]').onclick=()=>{modal.remove();playSurrenderEnding()};modal.querySelector('[data-cancel]').focus()}
  function playSurrenderEnding(){clearTimeout(S.openingTimer);S.activeTyping?.cancel();document.querySelector('.dialogue')?.remove();stopSound(S.openingSound);S.openingSound=null;stopSound(S.moleSound);S.moleSound=null;stopCaveAmbient();stopDrips();stopHotelAudio();dialogueVideo.pause();dialogueVideo.onended=null;dialogueVideo.onerror=null;dialogueVideo.onclick=null;dialogueVideo.removeAttribute('src');dialogueVideo.load();dialogueVideo.style.display='none';const screen=document.createElement('div');screen.className='surrender-video-screen';const video=document.createElement('video');video.preload='auto';video.playsInline=true;video.src=asset(media.surrender);video.setAttribute('aria-label','Финальная видеозаставка');let ended=false;const finish=()=>{if(ended)return;ended=true;screen.remove();const ending=document.createElement('div');ending.className='surrender-ending';ending.innerHTML='<h1>Конец игры</h1><p>вы совершили суицид</p>';document.body.append(ending)};video.addEventListener('ended',finish,{once:true});video.addEventListener('error',finish,{once:true});screen.append(video);document.body.append(screen);video.play().catch(()=>{video.controls=true})}
  $('#surrenderButton').onclick=openSurrenderConfirmation;
  $('#viewport').addEventListener('pointerdown',()=>{if(S.hotelStarted){ensureHotelAmbience();if(S.screen==='hall')ensureHallHum()}},{passive:true});
  function showUpper(){setImage('upper',media.upper,'Выход лифта');}
 // Start in the quiet black opening unless a direct test start was requested in the URL.
 const quickStart=new URLSearchParams(window.location.search).get('start');
  if(['hall','corridor','up7','hotel'].includes(quickStart)){$('#intro-black').style.display='none';enterHotelHall()}
 else{setScreen('intro',null,'');$('#intro-black').style.display='flex';$('#viewport').addEventListener('click',()=>{if(!S.introStarted)startIntro()},{once:true})}
})();
</script>
